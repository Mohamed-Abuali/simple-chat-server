<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>chat server</title>
</head>
<body>  

      
        <input id="sender" type="text" placeholder="enter your id"/>
        <input id="receiver" type="text" placeholder="enter the receiver id"/>
        <input id="msg-box" type="text" placeholder="enter your message"/>
        <button id="send">Send</button>
        

    <button id="connect">Connect</button>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

    <script>
      
        const msg = document.getElementById("msg-box")
        const id = document.getElementById("sender");
        const res = document.getElementById("receiver");

        const textRes = document.getElementById("res");
        const connect = document.getElementById("connect");
        const send = document.getElementById("send");

        const socket = io("http://localhost:8000");


    
    connect.addEventListener("click",(e) => {
      e.preventDefault()
      
      socket.emit("join",id.value)
     
    })
    send.addEventListener("click",(e) => {
      e.preventDefault()
     socket.emit("pri-msg",{
        from:id.value,
        to:res.value,
        msg:msg.value
      })
    })
    socket.on("msg",(msg) => {
      
      textRes.innerText = `${msg.from} ${msg.msg}`;
      
    })

    
    </script>
</body>
</html>
