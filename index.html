<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>chat server</title>
</head>
<body>  

      
        <input id="sender" type="text" placeholder="enter your id"/>
        <input id="receiver" type="text" placeholder="enter the receiver id"/>
        <input id="msg-box" type="text" placeholder="enter your message"/>
        <button id="send">Send</button>
        <p id="res">waiting...</p>

    <button id="connect">Connect</button>
    <p id="join">waiting to join...</p>
    <div id="rooms">
      <button id="create-room">Create A New Room</button>
      <input id="room-name" type="text" placeholder="enter your room name" required/>

      <input id="room-id" type="text" placeholder="enter the room id" required/>
      <button id="join-room">Join</button>

    </div>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

    <script>
      
        const msg = document.getElementById("msg-box")
        const id = document.getElementById("sender");
        const res = document.getElementById("receiver");
        const join = document.getElementById("join");

        const textRes = document.getElementById("res");
        const connect = document.getElementById("connect");
        const send = document.getElementById("send");

        const createBtn = document.getElementById("create-room")
        const roomName = document.getElementById("room-name")
        const joinBtn = document.getElementById("join-room")
        const roomId = document.getElementById("room-id")
        const socket = io("http://localhost:8000");
      

    createBtn.addEventListener("click",() => {
      socket.emit("create",id.value,roomName.value)
      socket.on("roomid",(roomid) => {
        console.log(roomid)
      })
    })
    joinBtn.addEventListener("click",() => {
      socket.emit("join",roomId.value)
            socket.on("reply",(data) => {
        join.innerText = data;
        join.style.color = "green"
      })
    })

    connect.addEventListener("click",(e) => {
      e.preventDefault()
      socket.emit("connected",() => {
        socket.on("reply",(data) => {
          console.log(data)
        })
      })
      

     
    })
    send.addEventListener("click",(e) => {
      e.preventDefault()
     socket.emit("pri-msg",{
        from:id.value,
        to:res.value,
        msg:msg.value
      })
    })
    socket.on("msg",(msg) => {
      
      textRes.innerText = `${msg.from} ${msg.hist}`;
      
    })

    
    </script>
</body>
</html>
