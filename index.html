<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>chat server</title>
</head>
<body>  

        <label for="msg-box">Message box</label>
        <input id="sender" type="text" placeholder="enter your id"/>
        <input id="receiver" type="text" placeholder="enter the receiver id"/>
        <input id="msg-box" type="text" placeholder="enter your message"/>
        <button id="send">Send</button>
        

    <button id="connect">Connect</button>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

    <script>
      
        const msg = document.getElementById("msg-box")
        const id = document.getElementById("sender");
        const textRes = document.getElementById("res");
        const connect = document.getElementById("connect");
        const send = document.getElementById("send");

        const socket = io("http://localhost:8000");


    
    connect.addEventListener("click",(e) => {
      e.preventDefault()
      
      socket.emit("join",{
        senderId:id.value,
        receiverId:1234,
        msg:msg.value
      })
     
    })
        send.addEventListener("click",(e) => {
      e.preventDefault()
      socket.emit("message",msg.value)
      socket.on("reply",(data) => {
        textRes.innerText = data;
      })
    })

    
    </script>
</body>
</html>
